<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card of the Day - Tarot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #4a148c;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-style: italic;
        }

        .card-display {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card-name {
            font-size: 2em;
            color: #4a148c;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .card-section {
            margin: 20px 0;
            text-align: left;
        }

        .card-section h3 {
            color: #6a1b9a;
            font-size: 1.3em;
            margin-bottom: 10px;
            border-bottom: 2px solid #9c27b0;
            padding-bottom: 5px;
        }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }

        .keyword {
            background: #9c27b0;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            text-transform: capitalize;
        }

        .meaning {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
            text-align: justify;
        }

        .loading {
            color: #666;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
            margin: 20px 0;
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        footer a {
            color: #9c27b0;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Card of the Day</h1>
        <div class="date" id="dateDisplay"></div>
        <div id="cardContainer">
            <div class="loading">Loading your card...</div>
        </div>
        <footer>
            <p>Data from <a href="https://oraclume.com" target="_blank">Oraclume</a></p>
            <p>Same card shown all day based on today's date</p>
        </footer>
    </div>

    <script>
        // Get today's date as a seed for deterministic card selection
        function getTodaySeed() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            // Create a number from YYYYMMDD
            return year * 10000 + month * 100 + day;
        }

        // Simple seeded random number generator
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        // Format today's date for display
        function formatDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return today.toLocaleDateString('en-US', options);
        }

        // Display the card
        function displayCard(card) {
            const container = document.getElementById('cardContainer');
            
            const keywordsHTML = card.keywords
                .map(keyword => `<span class="keyword">${keyword}</span>`)
                .join('');

            container.innerHTML = `
                <div class="card-display">
                    <div class="card-name">${card.name}</div>
                    
                    <div class="card-section">
                        <h3>Keywords</h3>
                        <div class="keywords">
                            ${keywordsHTML}
                        </div>
                    </div>

                    <div class="card-section">
                        <h3>Upright Meaning</h3>
                        <div class="meaning">${card.upright.meaning}</div>
                    </div>
                </div>
            `;
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // Main function to load and display card of the day
        async function loadCardOfTheDay() {
            try {
                // Display today's date
                document.getElementById('dateDisplay').textContent = formatDate();

                // Load both JSON files
                const [majorResponse, minorResponse] = await Promise.all([
                    fetch('Major_Arcana.json'),
                    fetch('Minor_Arcana.json')
                ]);

                if (!majorResponse.ok || !minorResponse.ok) {
                    throw new Error('Failed to load card data');
                }

                const majorData = await majorResponse.json();
                const minorData = await minorResponse.json();

                // Combine all cards into one array
                const allCards = [];
                
                // Add Major Arcana cards
                allCards.push(...majorData.cards);

                // Add Minor Arcana cards from all suits
                minorData.suits.forEach(suit => {
                    allCards.push(...suit.cards);
                });

                // Get today's seed and select a card
                const seed = getTodaySeed();
                const randomValue = seededRandom(seed);
                const cardIndex = Math.floor(randomValue * allCards.length);
                const selectedCard = allCards[cardIndex];

                // Display the selected card
                displayCard(selectedCard);

            } catch (error) {
                console.error('Error loading card:', error);
                showError('Unable to load card data. Please make sure the JSON files are available.');
            }
        }

        // Load card when page loads
        loadCardOfTheDay();
    </script>
</body>
</html>
