<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card of the Day - Tarot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: 
                linear-gradient(rgba(13, 27, 62, 0.85), rgba(13, 27, 62, 0.85)),
                url('assets/tarot-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-style: italic;
        }

        .card-display {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card-name {
            font-size: 2em;
            color: #1e3a8a;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .card-section {
            margin: 20px 0;
            text-align: left;
        }

        .card-section h3 {
            color: #1e40af;
            font-size: 1.3em;
            margin-bottom: 10px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }

        .keyword {
            background: #3b82f6;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            text-transform: capitalize;
        }

        .meaning {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
            text-align: justify;
        }

        .loading {
            color: #666;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
            margin: 20px 0;
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        footer a {
            color: #3b82f6;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: #ccc;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
            padding: 0;
        }

        .toggle-switch.active {
            background-color: #3b82f6;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .toggle-switch.active::after {
            left: 24px;
        }

        .toggle-label {
            font-size: 0.95em;
            color: #333;
            font-weight: 500;
        }

        .nav-link {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.95em;
            transition: background-color 0.3s;
        }

        .nav-link:hover {
            background-color: #2563eb;
        }

        .hidden {
            display: none;
        }

        .card-illustration {
            width: 200px;
            height: 300px;
            margin: 20px auto;
            border: 3px solid #3b82f6;
            border-radius: 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .card-illustration svg {
            width: 100%;
            height: 100%;
        }

        .watch-for-section {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            text-align: left;
        }

        .watch-for-section h3 {
            color: #1e40af;
            font-size: 1.2em;
            margin-bottom: 10px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }

        .watch-for-list {
            list-style: none;
            padding-left: 0;
        }

        .watch-for-list li {
            color: #333;
            margin: 8px 0;
            padding-left: 25px;
            position: relative;
            line-height: 1.5;
        }

        .watch-for-list li:before {
            content: "⚠️";
            position: absolute;
            left: 0;
        }

        .card-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .detail-item {
            background: #eff6ff;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            border-left: 3px solid #3b82f6;
        }

        .detail-label {
            font-weight: bold;
            color: #1e40af;
            font-size: 0.9em;
        }

        .detail-value {
            color: #333;
            margin-top: 3px;
        }

        @media (max-width: 600px) {
            .card-details {
                grid-template-columns: 1fr;
            }

            .card-illustration {
                width: 150px;
                height: 225px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Card of the Day</h1>
        <div class="date" id="dateDisplay"></div>
        
        <div class="controls">
            <div class="toggle-container">
                <span class="toggle-label">Show Reversed Meaning</span>
                <button class="toggle-switch" id="reversedToggle" aria-label="Toggle reversed meaning"></button>
            </div>
            <a href="three-card-spread.html" class="nav-link">← Three Card Spread</a>
        </div>
        
        <div id="cardContainer">
            <div class="loading">Loading your card...</div>
        </div>
        <footer>
            <p>Data from <a href="https://oraclume.com" target="_blank">Oraclume</a></p>
            <p>Same card shown all day based on today's date</p>
        </footer>
    </div>

    <script>
        // Get today's date as a seed for deterministic card selection
        function getTodaySeed() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            // Create a number from YYYYMMDD
            return year * 10000 + month * 100 + day;
        }

        // Simple seeded random number generator
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        // Format today's date for display
        function formatDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return today.toLocaleDateString('en-US', options);
        }

        // Generate a deterministic card illustration based on card name
        function generateCardIllustration(card) {
            const seed = card.id || 0;
            const colors = ['#1e3a8a', '#1e40af', '#2563eb', '#3b82f6', '#60a5fa', '#0ea5e9', '#06b6d4', '#0891b2', '#0e7490', '#155e75'];
            const color1 = colors[seed % colors.length];
            const color2 = colors[(seed + 1) % colors.length];
            
            // Create a unique pattern based on card properties
            const symbolIndex = seed % 4;
            const symbols = [
                // Star symbol
                `<g opacity="0.3">
                    <polygon points="100,20 130,90 200,90 145,135 170,205 100,160 30,205 55,135 0,90 70,90" fill="${color1}"/>
                </g>`,
                // Circle pattern
                `<g opacity="0.3">
                    <circle cx="50" cy="50" r="40" fill="${color1}"/>
                    <circle cx="150" cy="100" r="35" fill="${color2}"/>
                    <circle cx="80" cy="150" r="30" fill="${color1}"/>
                    <circle cx="140" cy="180" r="25" fill="${color2}"/>
                </g>`,
                // Wave pattern
                `<g opacity="0.3">
                    <path d="M 0 100 Q 25 50, 50 100 T 100 100 T 150 100 T 200 100" stroke="${color1}" stroke-width="3" fill="none"/>
                    <path d="M 0 150 Q 25 100, 50 150 T 100 150 T 150 150 T 200 150" stroke="${color2}" stroke-width="3" fill="none"/>
                </g>`,
                // Diamond pattern
                `<g opacity="0.3">
                    <polygon points="100,20 180,100 100,180 20,100" fill="${color1}"/>
                    <polygon points="100,60 140,100 100,140 60,100" fill="${color2}"/>
                </g>`
            ];

            return `
                <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:${color1};stop-opacity:1" />
                            <stop offset="100%" style="stop-color:${color2};stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Background -->
                    <rect width="200" height="300" fill="url(#cardGrad)"/>
                    
                    <!-- Pattern -->
                    ${symbols[symbolIndex]}
                    
                    <!-- Border -->
                    <rect width="200" height="300" fill="none" stroke="white" stroke-width="2"/>
                    
                    <!-- Card name text -->
                    <text x="100" y="280" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Georgia, serif">
                        ${card.name.substring(0, 15)}
                    </text>
                </svg>
            `;
        }

        // Generate watch-fors based on card meaning
        function generateWatchFors(card, showReversed) {
            const meaning = showReversed && card.reversed ? card.reversed.meaning : card.upright.meaning;
            const watchFors = [];

            // Extract key themes from the meaning
            if (showReversed && card.reversed) {
                // For reversed cards, create watch-fors from the reversed meaning
                if (card.reversed.love) watchFors.push(`In love: ${card.reversed.love}`);
                if (card.reversed.career) watchFors.push(`In career: ${card.reversed.career}`);
                if (card.reversed.finance) watchFors.push(`With finances: ${card.reversed.finance}`);
            } else {
                // For upright cards
                if (card.upright.love) watchFors.push(`In love: ${card.upright.love}`);
                if (card.upright.career) watchFors.push(`In career: ${card.upright.career}`);
                if (card.upright.finance) watchFors.push(`With finances: ${card.upright.finance}`);
            }

            // If we don't have enough watch-fors, add some from keywords
            if (watchFors.length < 3 && card.keywords) {
                const keywordTips = {
                    'beginnings': 'Be open to new opportunities',
                    'abundance': 'Recognize blessings around you',
                    'intuition': 'Trust your inner voice',
                    'conflict': 'Address tensions directly',
                    'transformation': 'Embrace change gracefully',
                    'endings': 'Let go of what no longer serves',
                    'balance': 'Seek equilibrium in all things',
                    'creativity': 'Express yourself authentically',
                    'power': 'Use your influence wisely',
                    'wisdom': 'Seek counsel from trusted sources'
                };

                for (let keyword of card.keywords) {
                    if (keywordTips[keyword] && watchFors.length < 3) {
                        watchFors.push(keywordTips[keyword]);
                    }
                }
            }

            return watchFors.slice(0, 3); // Return top 3 watch-fors
        }

        // Display the card
        function displayCard(card) {
            const container = document.getElementById('cardContainer');
            const showReversed = document.getElementById('reversedToggle').classList.contains('active');
            
            const keywordsHTML = card.keywords
                .map(keyword => `<span class="keyword">${keyword}</span>`)
                .join('');

            const cardIllustration = generateCardIllustration(card);
            const watchFors = generateWatchFors(card, showReversed);
            const watchForsHTML = watchFors
                .map(watchFor => `<li>${watchFor}</li>`)
                .join('');

            const meaningSection = showReversed && card.reversed && card.reversed.meaning
                ? `
                    <div class="card-section">
                        <h3>Reversed Meaning</h3>
                        <div class="meaning">${card.reversed.meaning}</div>
                    </div>
                `
                : `
                    <div class="card-section">
                        <h3>Upright Meaning</h3>
                        <div class="meaning">${card.upright.meaning}</div>
                    </div>
                `;

            const detailsHTML = `
                <div class="card-details">
                    ${card.element ? `<div class="detail-item"><div class="detail-label">Element</div><div class="detail-value">${card.element}</div></div>` : ''}
                    ${card.astrological ? `<div class="detail-item"><div class="detail-label">Astrological</div><div class="detail-value">${card.astrological}</div></div>` : ''}
                    ${card.yes_no ? `<div class="detail-item"><div class="detail-label">Yes/No</div><div class="detail-value">${card.yes_no}</div></div>` : ''}
                    ${card.arcana ? `<div class="detail-item"><div class="detail-label">Arcana</div><div class="detail-value">${card.arcana}</div></div>` : ''}
                </div>
            `;

            container.innerHTML = `
                <div class="card-display">
                    <div class="card-name">${card.name}</div>
                    
                    <div class="card-illustration">
                        ${cardIllustration}
                    </div>
                    
                    <div class="card-section">
                        <h3>Keywords</h3>
                        <div class="keywords">
                            ${keywordsHTML}
                        </div>
                    </div>

                    ${meaningSection}

                    <div class="watch-for-section">
                        <h3>👁️ Watch For Today</h3>
                        <ul class="watch-for-list">
                            ${watchForsHTML}
                        </ul>
                    </div>

                    ${detailsHTML}
                </div>
            `;
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // Main function to load and display card of the day
        let currentCard = null;

        async function loadCardOfTheDay() {
            try {
                // Display today's date
                document.getElementById('dateDisplay').textContent = formatDate();

                // Load both JSON files
                const [majorResponse, minorResponse] = await Promise.all([
                    fetch('Major_Arcana.json'),
                    fetch('Minor_Arcana.json')
                ]);

                if (!majorResponse.ok || !minorResponse.ok) {
                    throw new Error('Failed to load card data');
                }

                const majorData = await majorResponse.json();
                const minorData = await minorResponse.json();

                // Combine all cards into one array
                const allCards = [];
                
                // Add Major Arcana cards
                allCards.push(...majorData.cards);

                // Add Minor Arcana cards from all suits
                minorData.suits.forEach(suit => {
                    allCards.push(...suit.cards);
                });

                // Get today's seed and select a card
                const seed = getTodaySeed();
                const randomValue = seededRandom(seed);
                const cardIndex = Math.floor(randomValue * allCards.length);
                currentCard = allCards[cardIndex];

                // Display the selected card
                displayCard(currentCard);

                // Setup toggle listener
                const toggle = document.getElementById('reversedToggle');
                toggle.addEventListener('click', () => {
                    toggle.classList.toggle('active');
                    if (currentCard) {
                        displayCard(currentCard);
                    }
                });

            } catch (error) {
                console.error('Error loading card:', error);
                showError('Unable to load card data. Please make sure the JSON files are available.');
            }
        }

        // Load card when page loads
        loadCardOfTheDay();
    </script>
</body>
</html>
