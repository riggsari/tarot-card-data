<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Card Spread - Past, Present, Future</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .card-position {
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .card-name {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #764ba2;
        }

        .card-status {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card.reversed {
            transform: rotate(180deg);
        }

        .card-meaning {
            text-align: left;
            line-height: 1.6;
            color: #555;
            font-size: 0.95rem;
        }

        .button-container {
            text-align: center;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #764ba2;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 2rem;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .cards-container {
                gap: 1rem;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Three Card Spread</h1>
        <p class="subtitle">Past • Present • Future</p>
        
        <div id="content">
            <div class="loading">Loading cards...</div>
        </div>

        <div class="button-container">
            <button id="drawButton" onclick="drawCards()" style="display: none;">Draw Again</button>
        </div>
    </div>

    <script>
        let majorArcana = [];
        let minorArcana = [];
        let allCards = [];

        // Load both JSON files
        async function loadCards() {
            try {
                const [majorResponse, minorResponse] = await Promise.all([
                    fetch('Major_Arcana.json'),
                    fetch('Minor_Arcana.json')
                ]);

                if (!majorResponse.ok || !minorResponse.ok) {
                    throw new Error('Failed to load card data');
                }

                const majorData = await majorResponse.json();
                const minorData = await minorResponse.json();

                // Extract cards from Major Arcana
                majorArcana = majorData.cards;

                // Extract cards from Minor Arcana (flatten all suits)
                minorArcana = [];
                minorData.suits.forEach(suit => {
                    minorArcana.push(...suit.cards);
                });

                // Combine all cards
                allCards = [...majorArcana, ...minorArcana];

                // Initial draw
                drawCards();
                document.getElementById('drawButton').style.display = 'inline-block';
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Cards</h2>
                        <p>${error.message}</p>
                        <p>Please make sure Major_Arcana.json and Minor_Arcana.json are in the same directory.</p>
                    </div>
                `;
            }
        }

        // Get random cards without replacement
        function getRandomCards(count) {
            const shuffled = [...allCards].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // Draw three cards for Past, Present, Future
        function drawCards() {
            const positions = ['Past', 'Present', 'Future'];
            const drawnCards = getRandomCards(3);

            let html = '<div class="cards-container">';
            
            drawnCards.forEach((card, index) => {
                // 50% chance to be reversed
                const isReversed = Math.random() < 0.5;
                const meaning = isReversed 
                    ? (card.reversed.meaning || card.reversed) 
                    : (card.upright.meaning || card.upright);
                const status = isReversed ? 'Reversed' : 'Upright';
                const reversedClass = isReversed ? 'reversed' : '';
                
                html += `
                    <div class="card ${reversedClass}">
                        <div class="card-position">${positions[index]}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-status">${status}</div>
                        <div class="card-meaning">${meaning}</div>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        // Load cards when page loads
        loadCards();
    </script>
</body>
</html>
