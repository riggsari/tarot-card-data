<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Card Matching Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .stat {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .stat strong {
            display: block;
            font-size: 1.5em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card.face-down {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: transparent;
        }

        .card.face-down::before {
            content: '🔮';
            position: absolute;
            font-size: 3em;
            color: white;
        }

        .card.selected {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            border: 3px solid #ffd700;
        }

        .card.matched {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            cursor: default;
            opacity: 0.7;
        }

        .card.wrong {
            animation: shake 0.5s;
            border: 3px solid #ff4444;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .card-content {
            font-size: 1em;
            line-height: 1.4;
        }

        .card-name {
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .card-meaning {
            color: #333;
            font-size: 0.95em;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .final-stats {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .final-stats p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .missed-pairs {
            margin-top: 20px;
        }

        .missed-pair {
            background: #fff3cd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }

        .missed-pair-name {
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 5px;
        }

        .missed-pair-meaning {
            color: #555;
            font-size: 0.95em;
        }

        .difficulty-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .difficulty-selector label {
            color: white;
            font-size: 1.1em;
            margin-right: 10px;
        }

        .difficulty-selector select {
            padding: 8px 15px;
            font-size: 1em;
            border-radius: 5px;
            border: none;
            background: white;
            color: #764ba2;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .game-board {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
            }

            .card {
                min-height: 120px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 Tarot Card Matching Game 🔮</h1>
            <p>Match each tarot card with its meaning!</p>
        </div>

        <div class="difficulty-selector">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy (6 pairs)</option>
                <option value="medium" selected>Medium (10 pairs)</option>
                <option value="hard">Hard (15 pairs)</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat">
                <span>Time</span>
                <strong id="timer">0:00</strong>
            </div>
            <div class="stat">
                <span>Matches</span>
                <strong id="matches">0</strong>
            </div>
            <div class="stat">
                <span>Attempts</span>
                <strong id="attempts">0</strong>
            </div>
            <div class="stat">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button id="startBtn" onclick="startGame()">Start Game</button>
            <button id="resetBtn" onclick="resetGame()" style="display: none;">Reset Game</button>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>🎉 Game Complete! 🎉</h2>
            <div class="final-stats">
                <p><strong>Time:</strong> <span id="finalTime"></span></p>
                <p><strong>Total Matches:</strong> <span id="finalMatches"></span></p>
                <p><strong>Total Attempts:</strong> <span id="finalAttempts"></span></p>
                <p><strong>Accuracy:</strong> <span id="accuracy"></span>%</p>
                <p><strong>Final Score:</strong> <span id="finalScore"></span></p>
            </div>
            <div class="missed-pairs" id="missedPairs"></div>
            <button onclick="closeModal()">Close</button>
            <button onclick="playAgain()">Play Again</button>
        </div>
    </div>

    <script>
        let cards = [];
        let gameCards = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let attempts = 0;
        let score = 0;
        let timerInterval;
        let seconds = 0;
        let gameStarted = false;
        let missedPairs = [];

        // Load tarot card data
        async function loadCards() {
            try {
                const [majorResponse, minorResponse] = await Promise.all([
                    fetch('Major_Arcana.json'),
                    fetch('Minor_Arcana.json')
                ]);

                const majorData = await majorResponse.json();
                const minorData = await minorResponse.json();

                // Extract cards from Major Arcana
                const majorCards = majorData.cards.map(card => ({
                    name: card.name,
                    meaning: card.upright.meaning,
                    keywords: card.keywords.join(', ')
                }));

                // Extract cards from Minor Arcana
                const minorCards = [];
                minorData.suits.forEach(suit => {
                    suit.cards.forEach(card => {
                        minorCards.push({
                            name: card.name,
                            meaning: card.upright.meaning,
                            keywords: card.keywords.join(', ')
                        });
                    });
                });

                cards = [...majorCards, ...minorCards];
                console.log(`Loaded ${cards.length} tarot cards`);
            } catch (error) {
                console.error('Error loading cards:', error);
                alert('Error loading tarot card data. Please make sure the JSON files are available.');
            }
        }

        function startGame() {
            const difficulty = document.getElementById('difficulty').value;
            let numPairs;

            switch(difficulty) {
                case 'easy':
                    numPairs = 6;
                    break;
                case 'medium':
                    numPairs = 10;
                    break;
                case 'hard':
                    numPairs = 15;
                    break;
                default:
                    numPairs = 10;
            }

            // Reset game state
            matchedPairs = 0;
            attempts = 0;
            score = 0;
            seconds = 0;
            selectedCards = [];
            missedPairs = [];
            gameStarted = true;

            // Select random cards
            const selectedCardData = [...cards].sort(() => Math.random() - 0.5).slice(0, numPairs);

            // Create game cards (names and meanings)
            gameCards = [];
            selectedCardData.forEach((card, index) => {
                gameCards.push({
                    id: `name-${index}`,
                    type: 'name',
                    content: card.name,
                    pairId: index,
                    cardData: card
                });
                gameCards.push({
                    id: `meaning-${index}`,
                    type: 'meaning',
                    content: card.meaning,
                    pairId: index,
                    cardData: card
                });
            });

            // Shuffle cards
            gameCards.sort(() => Math.random() - 0.5);

            // Render game board
            renderBoard();

            // Update UI
            updateStats();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'inline-block';
            document.getElementById('difficulty').disabled = true;

            // Start timer
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                updateTimer();
            }, 1000);
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            gameCards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card face-down';
                cardElement.dataset.index = index;
                cardElement.onclick = () => selectCard(index);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'card-content';
                
                if (card.type === 'name') {
                    contentDiv.innerHTML = `<div class="card-name">${card.content}</div>`;
                } else {
                    contentDiv.innerHTML = `<div class="card-meaning">${card.content}</div>`;
                }

                cardElement.appendChild(contentDiv);
                board.appendChild(cardElement);
            });
        }

        function selectCard(index) {
            if (!gameStarted) return;

            const card = gameCards[index];
            const cardElement = document.querySelectorAll('.card')[index];

            // Ignore if already matched or selected
            if (cardElement.classList.contains('matched') || 
                cardElement.classList.contains('selected')) {
                return;
            }

            // Flip card
            cardElement.classList.remove('face-down');
            cardElement.classList.add('selected');
            selectedCards.push({ card, element: cardElement, index });

            // Check for match when two cards are selected
            if (selectedCards.length === 2) {
                attempts++;
                updateStats();

                const [first, second] = selectedCards;

                // Check if it's a valid match (same pairId, different types)
                if (first.card.pairId === second.card.pairId && 
                    first.card.type !== second.card.type) {
                    // Match!
                    setTimeout(() => {
                        first.element.classList.remove('selected');
                        second.element.classList.remove('selected');
                        first.element.classList.add('matched');
                        second.element.classList.add('matched');
                        
                        matchedPairs++;
                        score += 100;
                        updateStats();

                        // Check if game is complete
                        if (matchedPairs === gameCards.length / 2) {
                            endGame();
                        }

                        selectedCards = [];
                    }, 500);
                } else {
                    // No match
                    // Track missed pair
                    if (!missedPairs.some(mp => mp.name === first.card.cardData.name)) {
                        missedPairs.push(first.card.cardData);
                    }

                    setTimeout(() => {
                        first.element.classList.add('wrong');
                        second.element.classList.add('wrong');

                        setTimeout(() => {
                            first.element.classList.remove('selected', 'wrong');
                            second.element.classList.remove('selected', 'wrong');
                            first.element.classList.add('face-down');
                            second.element.classList.add('face-down');
                            selectedCards = [];
                        }, 500);
                    }, 500);

                    score = Math.max(0, score - 10);
                }
            }
        }

        function updateStats() {
            document.getElementById('matches').textContent = matchedPairs;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('score').textContent = score;
        }

        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = 
                `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function endGame() {
            clearInterval(timerInterval);
            gameStarted = false;

            // Calculate accuracy
            const accuracy = attempts > 0 ? Math.round((matchedPairs / attempts) * 100) : 0;

            // Update final stats
            document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
            document.getElementById('finalMatches').textContent = matchedPairs;
            document.getElementById('finalAttempts').textContent = attempts;
            document.getElementById('accuracy').textContent = accuracy;
            document.getElementById('finalScore').textContent = score;

            // Show missed pairs
            const missedPairsDiv = document.getElementById('missedPairs');
            if (missedPairs.length > 0) {
                missedPairsDiv.innerHTML = '<h3>Missed Pairs Review:</h3>';
                missedPairs.forEach(card => {
                    const pairDiv = document.createElement('div');
                    pairDiv.className = 'missed-pair';
                    pairDiv.innerHTML = `
                        <div class="missed-pair-name">${card.name}</div>
                        <div class="missed-pair-meaning">${card.meaning}</div>
                    `;
                    missedPairsDiv.appendChild(pairDiv);
                });
            } else {
                missedPairsDiv.innerHTML = '<h3>🎉 Perfect! No missed pairs!</h3>';
            }

            // Show modal
            document.getElementById('gameOverModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('active');
        }

        function playAgain() {
            closeModal();
            resetGame();
            startGame();
        }

        function resetGame() {
            clearInterval(timerInterval);
            gameStarted = false;
            matchedPairs = 0;
            attempts = 0;
            score = 0;
            seconds = 0;
            selectedCards = [];
            missedPairs = [];

            document.getElementById('gameBoard').innerHTML = '';
            document.getElementById('timer').textContent = '0:00';
            updateStats();

            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('difficulty').disabled = false;
        }

        // Load cards when page loads
        window.addEventListener('DOMContentLoaded', loadCards);
    </script>
</body>
</html>
